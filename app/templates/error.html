{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="empty-state py-5">
  <p class="display-1 fw-bold mb-2" style="color: var(--ars-primary); opacity: .85;">{{ code }}</p>
  <h1 class="h3">{{ title }}</h1>
  <p class="text-muted mb-4">{{ message }}</p>
  {% if current_user.is_authenticated %}
    <a class="btn btn-primary" href="{{ url_for('auth.index') }}">Back to my dashboard</a>
  {% else %}
    <a class="btn btn-primary" href="{{ url_for('auth.login') }}">Go to login</a>
  {% endif %}
</div>
{% endblock %}
